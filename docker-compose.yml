services:
  statllm:
    image: ghcr.io/mcocdaa/statllm:v0.3.0
    build: .
    container_name: statllm-app
    restart: unless-stopped
    ports:
      - "8008:8000"
    volumes:
      - ./statllm.db:/app/statllm.db
      # Uncomment below for local live-reload development only:
      # - ./web:/app/web
      # - ./statllm:/app/statllm
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/stats')"]
      interval: 30s
      timeout: 5s
      retries: 3
