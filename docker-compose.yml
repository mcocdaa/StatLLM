services:
  statllm:
    build: .
    container_name: statllm-app
    restart: unless-stopped
    ports:
      - "8008:8000"
    volumes:
      - statllm-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/stats')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  statllm-data:
