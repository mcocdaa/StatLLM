name: StatLLM CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Pytest & Database Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio
        pip install -e .

    - name: Verify SQLite Database Integrity
      run: |
        python -c "
        import sqlite3
        conn = sqlite3.connect('statllm.db')
        c = conn.cursor()
        c.execute('PRAGMA quick_check;')
        res = c.fetchall()
        assert res == [('ok',)], f'Quick check failed: {res}'
        c.execute('SELECT count(*) FROM samples;')
        total = c.fetchone()[0]
        assert total >= 1000, f'Expected at least 1000 samples, got {total}'
        print(f'Database verified healthy with {total} empirical samples across 15 models.')
        "

    - name: Run Test Suite
      run: |
        pytest -v tests/

    - name: Secret Leak Prevention Audit
      run: |
        echo "Scanning repository for accidental secret leaks..."
        ! grep -rnE "(sk-[a-zA-Z0-9_\-]{15,}|Bearer\s+[a-zA-Z0-9_\-]{15,})" --exclude-dir={.git,.venv,__pycache__} .
